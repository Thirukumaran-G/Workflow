name: Secrets and Environment Variables 

on:
    push:
        branches:
            - practice-secrets

# Workflow-level env vars (available to ALL jobs)
env:
    NODE_ENV: production
    APP_NAME: github-action-practice
    Build_NUMBER: ${{ github.run_number}}

jobs:
    use-secrets: 
        name: Use Secrets and Env Variables
        runs-on: ubuntu-latest
    
        # Job-level env vars (available to ALL steps in this job)
        env: 
            LOG_LEVEL: debug
        
        steps: 
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:    
                node-version: '20.x'
                cache: 'npm'
            
            - name: Install dependencies
              run: npm ci
            
            - name: Print environment variables
              run: |
                echo "App name : $APP_NAME"
                echo "Node Env     : $NODE_ENV"
                echo "Build Number : $BUILD_NUMBER"
                echo "Log Level    : $LOG_LEVEL"
            
            - name: Use secrets safely 
              env: 
                MY_SECRET: ${{ secrets.MY_SECRET }}
                API_KEY: ${{ secrets.API_KEY }}
                DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: |
                echo "MY_SECRET is set  : ${{ secrets.MY_SECRET != '' }}"
                echo "API_KEY is set    : ${{ secrets.API_KEY != '' }}"
                echo "DB_PASSWORD is set: ${{ secrets.DB_PASSWORD != '' }}"

            - name: Print Github context Variables
              run: |
                echo "Repository : ${{ github.repository }}"
                echo "Branch     : ${{ github.ref_name }}"
                echo "SHA        : ${{ github.sha }}"
                echo "Actor      : ${{ github.actor }}"
                echo "Event      : ${{ github.event_name }}"
                echo "Run ID     : ${{ github.run_id }}"
            
            - name: Run tests with env var injected
              env: 
                API_KEY: ${{ secrets.API_KEY }}
                NODE_ENV: test # step level node_env override the workflow_env
              run: npm test


    
        
    
