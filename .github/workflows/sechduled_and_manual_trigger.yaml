name: Manual Trigger and Sechudule Corn

on:
    workflow_dispatch:
        inputs: 
            environment:
                description: 'Target environment'
                required: true
                default: 'staging'
                type: choice
                options:
                    - staging
                    - production
                    - development
            
            run_test:
                description: 'Run tests before deploying..?'
                required: true
                default: true
                type: boolean
            
            version_tag:
                description: 'Version tag (e.g. v1.0.0)'
                required: false
                type: string

    schedule:
        - cron: '0 0 * * *'
        - cron: '0 6 * * 1'
    
    push:
        branches:
            - practice-scheduled

jobs:
    manual-deploy:
        name: Manual Deploy Job
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Show dispatch inputs
              run: |
                echo "==============================="
                echo "  Manual Deploy Started"
                echo "==============================="
                echo "Environment  : ${{ inputs.environment }}"
                echo "Run Tests    : ${{ inputs.run_test }}"
                echo "Version Tag  : ${{ inputs.version_tag || 'not provided' }}"
                echo "Triggered by : ${{ github.actor }}"
                echo "==============================="

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with: 
                node-version: '20.x'
                cache: 'npm'
            
            - name: Install dependencies
              run: npm ci
            
            - name: Run tests (conditional on Input)
              if: inputs.run_test == true
              run: npm test
                
            - name: Deploy to selectd environment
              run: |
                if [ "${{ inputs.environment }}" = "production" ]; then
                    echo "PRODUCTION deploy — running full build..."
                    npm run build
                    echo "Production deployment complete."
                elif [ "${{ inputs.environment }}" = "staging" ]; then
                    echo "Staging deploy..."
                    npm run build
                    echo "Staging deployment complete."
                else
                    echo "Development deploy..."
                    echo "Dev deployment complete."
                fi
            
    nightly-job: 
        name: Nightly Scheduled Jobs
        runs-on: ubuntu-latest
        if: github.event_name == 'schedule'
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20.x'
                cache: 'npm'
            
            - name: Install dependencies
              run: npm ci
            
            - name: Run full test suits
              run: npm test
            
            - name: Audit for security vulnerabilities
              run: npm audit --audit-level=high || echo "Review audit results above"
            
            - name: Check outdated packages
              run: npm outdated || true

            - name: Build and Verify
              run: npm run build
            
            - name: Nightly Summary
              run: |
                echo "==============================="
                echo "  Nightly Job Summary"
                echo "  Date    : $(date -u)"
                echo "  Repo    : ${{ github.repository }}"
                echo "  Status  : All checks passed"
                echo "==============================="
            
    push-job:
        name: Push Jobs
        runs-on: ubuntu-latest
        if: github.event_name == 'push'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with: 
                node-version: '20.x'
                cache: 'npm'
            
            - name: Install, test, build
              run: |
                npm ci
                npm test
                npm run build

            
            