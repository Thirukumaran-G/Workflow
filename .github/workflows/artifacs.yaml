name: Artifacts

on: 
    push: 
        branches: 
            - practise-artifacts

jobs: 
    build-and-upload:
        name: Checkout Code
        runs-on: ubuntu-latest
    
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with: 
                node-version: '20.x'
                cache: 'npm'

            - name: Install dependencies
              run: npm ci
            
            - name: Run Test
              run: npm test
            
            - name: Build Application
              run: npm run build

            - name: Verify Dist Before Uploading
              run: |
                echo "Files to upload:"
                ls -la dist/
            
            - name: upload dist/ as artifact
              uses: actions/upload-artifact@v4
              with: 
                name: app-build-dist
                path: dist/
                retention-days: 7
                if-no-files-found: error
            
    download-and-use:
        name: Download from Artifact Destroy
        runs-on: ubuntu-latest
        needs:  [build-and-upload]

        steps:
            - name: Download Artifacts
              uses: actions/download-artifact@v4
              with:
                name: app-build-dist
                path: ./downloaded-dist/

            - name: Verify downloaded file 
              run: |
                echo "Downloaded Artifact Contents"
                ls -ltr ./downloaded-dist/
            
            - name: Simulate Deployment
              run: echo "Deployment Done"
    
    quality-check:
        name: Quality Check on Artifacts
        runs-on: ubuntu-latest
        
        needs: [build-and-upload]
        
        steps: 
            - name: Download artifacts for QA
              uses: actions/doenload-artifact@v4
              with: 
                name: app-build-dist
                path: ./qa-dist/

            - name: Run Quality Checks
              run: |
                echo "Running QA Test"
                echo "QA finieshed"